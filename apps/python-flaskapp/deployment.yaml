apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-flaskapp-grp
  namespace: flaskapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-flaskapp-grp
  template:
    metadata:
      labels:
        app: python-flaskapp-grp
    spec:
      containers:
      - name: python-flaskapp-grp
        image: jamencidor/flaskapp:13.b4de09b
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "0.0.0-placeholder"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
