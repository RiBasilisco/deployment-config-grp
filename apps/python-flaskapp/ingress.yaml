apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-flaskapp
  namespace: flaskapp
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: python-flaskapp-grp
            port:
              number: 80
